[project]
name = "pyvl"
version = "0.0.1a"
authors = [{ name = "Jan Roth", email = "r0th.j4n@gmail.com" }]
description = "Panel code solver."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pyvista",
    "meshio>=5.3",
    "h5py>=3.12",
    "scipy",
    "imageio[ffmpeg]>=2.37.3",
]


[build-system]
requires = ["scikit-build-core", "numpy"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "."
build.verbose = true
logging.level = "INFO"
editable.verbose = true
editable.rebuild = false


[dependency-groups]
dev = [
    "build",
    "scikit-build-core",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "interrogate",
    "nox",
    "pre-commit",
    "codespell",
    "trame",
    "trame-vtk",
    "trame-vuetify",
    "tomli",
    "jupyter_sphinx",
    "pyvista[jupyter]",
    "ruff",
    "scalene>=2.3.0",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "python-docs-theme",
    "sphinx-favicon",
    "sphinx-design",
    "sphinx-gallery",
    "pypandoc",
    "pytest-sphinx",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-toolbox",
    "sphinxcontrib-websupport",
    "sphinxcontrib-asciinema",
    "threadpoolctl",
    "av",
    "imageio",
]


[tool.pyrefly]
project-includes = ["python/pyvl/**/*.py", "python/pyvl/**/*.pyi"]
use-ignore-files = true
search-path = ["python/pyvl"]
ignore-missing-imports = ["*"]

[tool.codespell]
skip = "sandbox/*"
count = true

[tool.ruff]
exclude = [".venv", ".nox", ".pytest_cache", ".vscode", "doc"]
line-length = 90

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint]
select = ["E", "W", "D", "I", "F", "ARG", "A", "FA", "ICN", "TID"]
ignore = ["ARG002"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest]
addopts = ["--doctest-modules", "-ra", "--cov=pyvl"]
testpaths = ["test/pytests", "python"]
console_output_style = "count"

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.interrogate]
ignore-init-method = true
fail-under = 100
exclude = ["sandbox", "doc", "build", ".*/", "cmake-*/"]
style = "sphinx"
verbose = 1
